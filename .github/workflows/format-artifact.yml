name: Format artifact

on:
  push:
    branches:
      - feature/deep-io-pipeline-v0.5

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo +1.98.0 fmt
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: |
            crates
          if-no-files-found: error
